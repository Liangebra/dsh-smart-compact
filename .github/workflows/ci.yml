name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  modern-dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Mount the built package through Cordis
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { Context } from '@deepseek-ai/cordis'
          import { CompactionEngine } from '@deepseek-ai/dsh-compaction'
          import SmartCompactEngine from 'dsh-smart-compact'
          const ctx = new Context()
          try {
            await ctx.plugin(SmartCompactEngine, { autoTools: false, autoNudge: false, thresholdRatio: 0.6 })
            const engine = ctx.get('compaction')
            assert.ok(engine instanceof CompactionEngine)
            assert.equal(engine.config.thresholdRatio, 0.6)
          } finally {
            await ctx.fiber.dispose()
          }
          JS
      - name: Verify tarball bundle through the DSH profile CLI
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --ignore-scripts pnpm@11 @deepseek-ai/dsh@0.2.3-alpha.2
          export DSH_HOME="$RUNNER_TEMP/dsh-profile-smoke"
          dsh plugin --profile tui add "$RUNNER_TEMP/dsh-smart-compact-0.2.1.tgz"
          dsh --profile tui --dump-config > "$RUNNER_TEMP/dsh-config.yml"
          cat "$RUNNER_TEMP/dsh-config.yml"
          grep -q 'id: compaction-smart' "$RUNNER_TEMP/dsh-config.yml"
          grep -q 'name: dsh-smart-compact' "$RUNNER_TEMP/dsh-config.yml"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          const manifest = JSON.parse(fs.readFileSync(path.join(process.env.DSH_HOME, 'profiles/tui/package.json'), 'utf8'))
          assert.ok(manifest.dsh.profile.bundles.includes('dsh-smart-compact'))
          JS
      - run: npm pack --dry-run
